# Optional config file for running the server outside Docker.
# In Docker, the same settings come from env vars (see compose.yaml / .env.example).
server:
  addr: "127.0.0.1:3000"
  domain: "chat.example.com"     # hostname users open while on the VPN
  vpn_cidrs: ["10.8.0.0/24"]     # WireGuard peer subnet(s) allowed in
  trusted_proxies: ["127.0.0.1/32"]  # reverse proxy whose X-Forwarded-For is trusted

storage:
  db_path: "./data/tailchat.db"
  blob_dir: "./data/blobs"
  max_blob_storage: "10GB"
  max_upload_size: "100MB"

cleanup:
  interval: "1h"  # how often to check for expired messages/blobs

logging:
  level: "info"   # debug, info, warn, error
  format: "json"
